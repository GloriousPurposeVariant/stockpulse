upstream django {
    server backend:8000;
}

upstream websocket {
    server ws-service:8081;
}

server {
    listen 80;
    server_name _;

    # Product photos are on the roadmap and the default is 1m, which turns a
    # perfectly ordinary upload into a confusing 413.
    client_max_body_size 10m;

    # Nginx serves these from disk. Routing them through Gunicorn would tie up
    # a worker that should be answering API calls.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /ws {
        proxy_pass http://websocket;

        # A websocket starts as HTTP and asks to switch protocols. Nginx
        # defaults to HTTP/1.0 upstream, which has no Upgrade mechanism, so
        # without these three lines the handshake silently becomes a plain
        # request and the connection closes.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An idle websocket sends nothing, and the default read timeout is 60s
        # - which is exactly why your Postman connection kept dropping.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://django;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to know the original request was HTTPS even though
        # it arrived here over plain HTTP on the internal network.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The React build. Any unknown path returns index.html so client-side
    # routing works on a page refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
