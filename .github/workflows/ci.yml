name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stockpulse
          POSTGRES_USER: stockpulse
          POSTGRES_PASSWORD: stockpulse
        ports:
          - 5432:5432
        # The runner starts the container and moves to the next step at once;
        # without a healthcheck the first connection races Postgres's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      SECRET_KEY: ci-not-a-real-secret
      JWT_SIGNING_KEY: ci-not-a-real-signing-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://stockpulse:stockpulse@localhost:5432/stockpulse
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check for unmade migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python -m pytest -q

  ws-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ws-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/*.js
